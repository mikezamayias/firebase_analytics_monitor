name: famon_core
description: Core library for Firebase Analytics event parsing, formatting, and persistence. Powers the famon CLI.
version: 1.5.1
repository: https://github.com/mikezamayias/famon
homepage: https://github.com/mikezamayias/famon
issue_tracker: https://github.com/mikezamayias/famon/issues
topics:
  - firebase
  - analytics
  - cli
  - monitoring

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  equatable: ^2.0.5
  get_it: ">=7.6.7 <10.0.0"
  injectable: ">=2.3.5 <4.0.0"
  isar: ^3.1.0+1
  mason_logger: ">=0.2.11 <0.4.0"
  path: ^1.8.3
  process: ^5.0.2
  yaml: ^3.1.2

dev_dependencies:
  build_runner: ^2.4.9
  injectable_generator: ">=2.1.6 <4.0.0"
  isar_generator: ^3.1.0+1
  mocktail: ^1.0.3
  test: ^1.25.2
  very_good_analysis: ">=5.1.0 <11.0.0"
